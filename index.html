<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BadReads</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header>
        <h1>BadReads</h1>
      </header>

      <dialog id="form-dialog">
        <form action="#" method="submit">
          <input type="text" />
        </form>
        <button type="button" id="close">Close</button>
      </dialog>
      <button id="open-add-book-form">New Book</button>

      <input
        id="book-count-slider"
        type="range"
        min="1"
        value="1"
        step="1"
        autocomplete="off"
      />
      <label for="book-count-input"
        >Book Quantity: <output id="book-count-output"></output
      ></label>

      <div>
        <ul class="books-list-container" id="books-list-container">
          <template id="book-card-template">
            <li class="book-card">
              <div class="book-cover">
                <article>
                  <h3 class="book-title"></h3>
                  <p class="book-author"></p>
                  <p class="book-length"></p>
                  <p class="book-description"></p>
                  <div class="book-action-buttons">
                    <button class="book-action-button">
                      <img
                        class="book-action-icon"
                        src="./assets/icons/trash-can-outline.svg"
                        alt=""
                      />
                      <span>Delete</span>
                    </button>
                    <div>
                      <label class="label-have-read-toggle">
                        <input type="checkbox" class="have-read-toggle" />
                      </label>
                    </div>
                  </div>
                </article>
              </div>
              <div class="book-back-cover-and-spine"></div>
            </li>
          </template>
        </ul>
      </div>
    </div>
  </body>
</html>
